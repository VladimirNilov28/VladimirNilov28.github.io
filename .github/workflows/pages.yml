name: Build and deploy documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [documentation-updated]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate documentation dispatch source
        if: github.event_name == 'repository_dispatch'
        run: node scripts/validate-dispatch.mjs

      - name: Install dependencies
        run: npm ci

      - name: Test documentation automation
        run: npm test

      - name: Synchronize documentation and build website
        run: npm run docs:build

      - name: Validate generated website
        run: npm run docs:check

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'repository_dispatch' && github.event.action == 'documentation-updated') ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'documentation-updated') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
